<!DOCTYPE html>
<html lang="en">
<head>
<!-- Third-party website analytics intentionally disabled. -->
<script>window.gtag = function(){};</script>
<script defer src="analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKANDY License Agreement</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/ik.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0e0e11;
    color: rgba(255,255,255,0.85);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  /* Draggable title bar */
  .titlebar {
    -webkit-app-region: drag;
    background: #0e0e11;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 12px 20px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .titlebar-logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.9);
  }
  .titlebar-sep {
    width: 1px; height: 14px;
    background: rgba(255,255,255,0.15);
  }
  .titlebar-title {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.04em;
  }

  /* EULA text scroll area */
  .eula-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 16px;
    font-size: 12px;
    line-height: 1.65;
    color: rgba(255,255,255,0.7);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  .eula-scroll::-webkit-scrollbar { width: 5px; }
  .eula-scroll::-webkit-scrollbar-track { background: transparent; }
  .eula-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .eula-text {
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 100%;
  }

  /* Scroll-to-bottom prompt */
  .scroll-hint {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    padding: 6px 0 2px;
    flex-shrink: 0;
    transition: opacity 0.3s;
  }
  .scroll-hint.hidden { opacity: 0; pointer-events: none; }

  /* Acceptance section */
  .accept-section {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 14px 24px 18px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    opacity: 0.35;
    transition: opacity 0.3s;
    cursor: default;
  }
  .checkbox-row.enabled { opacity: 1; cursor: pointer; }
  .checkbox-row input[type=checkbox] {
    margin-top: 1px;
    flex-shrink: 0;
    width: 14px; height: 14px;
    accent-color: var(--acc, #ff5a1f);
    cursor: pointer;
  }
  .checkbox-row input[type=checkbox]:disabled { cursor: default; }
  .checkbox-row label {
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    line-height: 1.5;
    cursor: inherit;
    user-select: none;
  }

  .button-row {
    display: flex;
    gap: 10px;
    margin-top: 2px;
  }

  .btn {
    padding: 9px 20px;
    border: none;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
    letter-spacing: 0.03em;
  }
  .btn:disabled { opacity: 0.25; cursor: default; }
  .btn-accept {
    background: var(--acc, #ff5a1f);
    color: #eae5d9;
    flex: 1;
  }
  .btn-accept:not(:disabled):hover { opacity: 0.88; }
  .btn-decline {
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.55);
    min-width: 80px;
  }
  .btn-decline:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }

  .status-line {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    min-height: 16px;
    transition: color 0.2s;
  }
  .status-line.error { color: #ff5a1f; }
</style>

<style>
/* THE RIG reskin overrides (appended after page styles) */
body{background:var(--chassis)!important;color:var(--ink)}
h1,h2{font-weight:800!important}
h3{font-weight:700!important}
code,pre,kbd{font-family:var(--mono)}
/* neutralize legacy element-level nav/footer rules leaking into the shell */
nav.rail{position:fixed!important;top:0!important;left:0!important;right:0!important;
  display:block!important;padding:0!important;margin:0!important;height:var(--nav-h)!important;
  background:linear-gradient(180deg,#191920,var(--rail))!important;
  border-bottom:1px solid #000!important;backdrop-filter:none!important;max-width:none!important}
nav.rail .rail-in{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 24px;
  display:flex;align-items:center;gap:22px}
footer.ftr{display:block!important;text-align:left!important;padding:0!important;margin:0!important;
  background:var(--chassis-deep)!important;border-top:1px solid #000!important;max-width:none!important}
footer.ftr a{text-decoration:none}
</style>
</head>
<body>

<div class="titlebar">
  <span class="titlebar-logo">IKANDY</span>
  <div class="titlebar-sep"></div>
  <span class="titlebar-title">License Agreement</span>
</div>

<div class="eula-scroll" id="eula-scroll">
  <pre class="eula-text" id="eula-text">Loading…</pre>
</div>

<div class="scroll-hint" id="scroll-hint">▼ Scroll to the bottom to continue</div>

<div class="accept-section">
  <div class="checkbox-row" id="row-read">
    <input type="checkbox" id="chk-read" disabled>
    <label for="chk-read">I have read and agree to the IKANDY License Agreement</label>
  </div>
  <div class="checkbox-row" id="row-beta">
    <input type="checkbox" id="chk-beta" disabled>
    <label for="chk-beta">I understand IKANDY is beta software and may be unstable or incomplete</label>
  </div>
  <div class="button-row">
    <button class="btn btn-decline" id="btn-decline">Decline</button>
    <button class="btn btn-accept" id="btn-accept" disabled>I Accept</button>
  </div>
  <div class="status-line" id="status-line"></div>
</div>

<script>
  // Block Escape and F-keys from dismissing the window
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'F4') {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);

  const scrollEl   = document.getElementById('eula-scroll');
  const eulaText   = document.getElementById('eula-text');
  const scrollHint = document.getElementById('scroll-hint');
  const rowRead    = document.getElementById('row-read');
  const rowBeta    = document.getElementById('row-beta');
  const chkRead    = document.getElementById('chk-read');
  const chkBeta    = document.getElementById('chk-beta');
  const btnAccept  = document.getElementById('btn-accept');
  const btnDecline = document.getElementById('btn-decline');
  const statusLine = document.getElementById('status-line');

  let scrolledToBottom = false;
  let busy = false;

  function updateAcceptState() {
    const canAccept = scrolledToBottom && chkRead.checked && chkBeta.checked;
    btnAccept.disabled = !canAccept;
  }

  function onScrolled() {
    const remaining = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight;
    if (!scrolledToBottom && remaining < 48) {
      scrolledToBottom = true;
      scrollHint.classList.add('hidden');
      rowRead.classList.add('enabled');
      rowBeta.classList.add('enabled');
      chkRead.disabled = false;
      chkBeta.disabled = false;
    }
    updateAcceptState();
  }

  scrollEl.addEventListener('scroll', onScrolled);

  chkRead.addEventListener('change', updateAcceptState);
  chkBeta.addEventListener('change', updateAcceptState);

  // Allow clicking the row labels to toggle checkboxes when enabled
  rowRead.addEventListener('click', e => {
    if (!chkRead.disabled && e.target !== chkRead) chkRead.click();
  });
  rowBeta.addEventListener('click', e => {
    if (!chkBeta.disabled && e.target !== chkBeta) chkBeta.click();
  });

  btnAccept.addEventListener('click', async () => {
    if (busy || btnAccept.disabled) return;
    busy = true;
    btnAccept.disabled = true;
    btnDecline.disabled = true;
    statusLine.textContent = 'Recording acceptance…';
    statusLine.classList.remove('error');
    try {
      await window.EULA.accept();
      statusLine.textContent = '✓ Accepted. Starting IKANDY…';
    } catch(e) {
      statusLine.textContent = 'Error recording acceptance. Please try again.';
      statusLine.classList.add('error');
      busy = false;
      btnAccept.disabled = false;
      btnDecline.disabled = false;
    }
  });

  btnDecline.addEventListener('click', async () => {
    if (busy) return;
    if (!confirm('Decline the License Agreement and quit IKANDY?')) return;
    busy = true;
    btnAccept.disabled = true;
    btnDecline.disabled = true;
    statusLine.textContent = 'Closing…';
    try { await window.EULA.decline(); } catch(e) {}
  });

  // Load EULA text on init
  (async () => {
    try {
      const { text, version } = await window.EULA.getEulaText();
      eulaText.textContent = text;
      // Check if content fits without scrolling (very short screens)
      setTimeout(() => {
        const remaining = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight;
        if (remaining < 8) onScrolled(); // already at bottom
      }, 100);
    } catch(e) {
      eulaText.textContent = 'This page is shown inside the IKANDY application on first launch.\n\nTo read the full IKANDY License Agreement online, visit:\nhttps://ikandy.app/license.html';
      statusLine.textContent = 'Error loading agreement text.';
      statusLine.classList.add('error');
    }
  })();
</script>
</body>
</html>
