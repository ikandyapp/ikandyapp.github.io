<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-UiRpQ1MZvz0yC760TXEB+Na6RItlbO3BYz7901a69yE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<!-- Third-party website analytics intentionally disabled. -->
<script defer src="/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,follow">
<title>IKANDY ARCADE — Volley</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: "Courier New", monospace; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
.topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; border-bottom: 1px solid #333; }
.topbar-logo { color: #d4a843; font-size: 14px; letter-spacing: .15em; text-decoration: none; }
.topbar-back { color: #888; font-size: 11px; text-decoration: none; letter-spacing: .1em; }
.topbar-back:hover { color: #fff; }
.spacer { height: 10px; }
canvas { border: 1px solid #111; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.overlay.hidden { display: none; }
.overlay h1 { font-size: 36px; letter-spacing: .2em; }
.overlay p { color: #888; font-size: 12px; letter-spacing: .1em; }
.overlay button { background: #000; color: #fff; border: 1px solid #fff; font-family: "Courier New", monospace; font-size: 14px; padding: 10px 28px; cursor: pointer; letter-spacing: .15em; margin-top: 8px; }
.overlay button:hover { background: #fff; color: #000; }

/* === Unified arcade opening overlay === */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; z-index: 100; }
.overlay.hidden { display: none; }
.overlay h1 { color: #fff; font-size: 44px; letter-spacing: .3em; text-shadow: 0 0 18px rgba(255,255,255,.4); margin: 0; font-family: "Courier New", monospace; }
.overlay p { color: #888; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; margin: 0; max-width: 560px; text-align: center; line-height: 1.6; font-family: "Courier New", monospace; }
.overlay button { background: #000; color: #fff; border: 1px solid #fff; font-family: "Courier New", monospace; font-size: 14px; padding: 12px 36px; cursor: pointer; letter-spacing: .3em; margin-top: 10px; }
.overlay button:hover { background: #fff; color: #000; }

/* Back button + row layout */
.overlay .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.overlay button.secondary { color: #888; border-color: #555; }
.overlay button.secondary:hover { background: #555; color: #fff; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="topbar-logo">IKANDY ARCADE</a>
  <a href="index.html" class="topbar-back">&larr; HOME</a>
</div>
<div class="spacer"></div>
<canvas id="game" width="640" height="420" tabindex="0" role="application" aria-label="Volley game board" aria-describedby="volley-instructions"></canvas>
<div class="overlay" id="start-overlay" role="dialog" aria-modal="true" aria-labelledby="volley-title">
  <h1 id="volley-title">VOLLEY</h1>
  <p id="volley-instructions">W / S &nbsp;&middot;&nbsp; &uarr; / &darr; &nbsp; TO MOVE YOUR PADDLE (LEFT SIDE)</p>
  <p>5 LIVES &middot; AI GETS FASTER EVERY POINT &middot; ENDLESS</p>
  <button id="btn-start" autofocus>[ PRESS START ]</button>
</div>
<div class="overlay hidden" id="over-overlay" role="dialog" aria-modal="true" aria-labelledby="volley-over-title">
  <h1 id="volley-over-title">GAME OVER</h1>
  <p id="final-score" aria-live="polite"></p>
  <div class="btn-row"><button id="btn-retry">[ PLAY AGAIN ]</button><button id="btn-back" class="secondary">[ BACK TO ARCADE ]</button></div>
</div>
<script>
(() => {
  'use strict';
  let interactions = 0;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 640, H = 420;
  const LIVES_MAX = 5;
  const PW = 10, PH = 70, PSPEED = 5, BZ = 8;
  const PX_LEFT = 20, PX_RIGHT = W - 20 - PW;

  let playerY, aiY, ball, pScore, aScore, lives, running, animId, keys = {};

  function resetBall(toRight) {
    ball = { x: W / 2, y: H / 2, vx: (toRight ? 1 : -1) * 4.6, vy: (Math.random() < .5 ? 1 : -1) * 3.2 };
  }

  function startGame() {
    playerY = H / 2 - PH / 2; aiY = H / 2 - PH / 2;
    pScore = 0; aScore = 0; lives = LIVES_MAX; running = true; interactions = 0;
    resetBall(true);
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('over-overlay').classList.add('hidden');
    canvas.focus();
    cancelAnimationFrame(animId); loop();
  }

  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','w','s'].includes(e.key)) { e.preventDefault(); interactions++; }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function update() {
    if (keys['ArrowUp']   || keys['w']) playerY -= PSPEED;
    if (keys['ArrowDown'] || keys['s']) playerY += PSPEED;
    playerY = Math.max(0, Math.min(H - PH, playerY));

    // AI escalates per AI point
    if (ball.vx > 0) {
      const aiCenter = aiY + PH / 2;
      const spd = 4.0 + aScore * 0.4;
      const diff = ball.y - aiCenter;
      if (Math.abs(diff) > 4) aiY += Math.sign(diff) * Math.min(spd, Math.abs(diff));
    }
    aiY = Math.max(0, Math.min(H - PH, aiY));

    ball.x += ball.vx; ball.y += ball.vy;

    if (ball.y < 0) { ball.y = 0; ball.vy *= -1; }
    if (ball.y + BZ > H) { ball.y = H - BZ; ball.vy *= -1; }

    if (ball.vx < 0 && ball.x <= PX_LEFT + PW && ball.x >= PX_LEFT && ball.y + BZ >= playerY && ball.y <= playerY + PH) {
      ball.x = PX_LEFT + PW;
      ball.vx = Math.abs(ball.vx) * 1.05;
      ball.vy += ((ball.y + BZ / 2) - (playerY + PH / 2)) * 0.12;
    }
    if (ball.vx > 0 && ball.x + BZ >= PX_RIGHT && ball.x + BZ <= PX_RIGHT + PW && ball.y + BZ >= aiY && ball.y <= aiY + PH) {
      ball.x = PX_RIGHT - BZ;
      ball.vx = -Math.abs(ball.vx) * 1.05;
      ball.vy += ((ball.y + BZ / 2) - (aiY + PH / 2)) * 0.12;
    }

    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > 16) { ball.vx = ball.vx / spd * 16; ball.vy = ball.vy / spd * 16; }

    if (ball.x < 0)  {
      aScore++; lives--;
      if (lives <= 0) { endGame(); return; }
      resetBall(true);
    }
    if (ball.x > W)  {
      pScore++;
      resetBall(false);
    }
  }

  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    ctx.setLineDash([10, 10]); ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#666'; ctx.font = '10px Courier New';
    ctx.textAlign = 'right'; ctx.fillText('SCORE', W / 2 - 24, 30);
    ctx.textAlign = 'left';  ctx.fillText('LIVES', W / 2 + 24, 30);

    ctx.font = 'bold 52px Courier New';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right'; ctx.fillText(pScore, W / 2 - 24, 80);
    ctx.fillStyle = lives <= 1 ? '#f44' : '#fff';
    ctx.textAlign = 'left';  ctx.fillText(lives, W / 2 + 24, 80);

    ctx.fillStyle = '#fff';
    ctx.fillRect(PX_LEFT,  playerY, PW, PH);
    ctx.fillRect(PX_RIGHT, aiY,     PW, PH);
    ctx.fillRect(ball.x, ball.y, BZ, BZ);
  }

  function loop() { if (!running) return; update(); draw(); animId = requestAnimationFrame(loop); }

  function endGame() {
    running = false; cancelAnimationFrame(animId);
    document.getElementById('final-score').textContent = `SCORE: ${pScore}`;
    document.getElementById('over-overlay').classList.remove('hidden');
    document.getElementById('btn-retry').focus();
  }

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-retry').addEventListener('click', startGame);
  document.getElementById('btn-back').addEventListener('click', function() { location.href = 'index.html'; });
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
