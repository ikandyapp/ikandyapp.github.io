<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKANDY ARCADE — Pong</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: "Courier New", monospace; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
.topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; border-bottom: 1px solid #333; }
.topbar-logo { color: #d4a843; font-size: 14px; letter-spacing: .15em; text-decoration: none; }
.topbar-back { color: #888; font-size: 11px; text-decoration: none; letter-spacing: .1em; }
.topbar-back:hover { color: #fff; }
.spacer { height: 10px; }
canvas { border: 1px solid #111; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.overlay.hidden { display: none; }
.overlay h1 { font-size: 36px; letter-spacing: .2em; }
.overlay p { color: #888; font-size: 12px; letter-spacing: .1em; }
.overlay button { background: #000; color: #fff; border: 1px solid #fff; font-family: "Courier New", monospace; font-size: 14px; padding: 10px 28px; cursor: pointer; letter-spacing: .15em; margin-top: 8px; }
.overlay button:hover { background: #fff; color: #000; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="topbar-logo">IKANDY ARCADE</a>
  <a href="index.html" class="topbar-back">&larr; HOME</a>
</div>
<div class="spacer"></div>
<canvas id="game" width="640" height="420"></canvas>
<div class="overlay" id="start-overlay">
  <h1>PONG</h1>
  <p>W / S &nbsp;&middot;&nbsp; &uarr; / &darr; &nbsp; TO MOVE YOUR PADDLE (LEFT SIDE)</p>
  <p>FIRST TO 7 WINS</p>
  <button id="btn-start">SERVE</button>
</div>
<div class="overlay hidden" id="over-overlay">
  <h1 id="over-title">YOU WIN!</h1>
  <p id="final-score"></p>
  <button id="btn-retry">PLAY AGAIN</button>
</div>
<script>
(() => {
  'use strict';
  const SUPABASE_URL      = 'https://grimznincoiujnurhmlx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyaW16bmluY29pdWpudXJobWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDQ5NzAsImV4cCI6MjA5MjcyMDk3MH0.X-eXBp4gF3RthSt10As83Ft4z5rOc929IMdis5BSuxk';
  const BEST_KEY = 'ikandy_pong_best';

  function getArcadeIdentity() {
    return { id: localStorage.getItem('ikandy_arcade_id_v1') || null, name: localStorage.getItem('ikandy_arcade_name') || null };
  }

  let interactions = 0, sessionId = '', startTime = 0;

  async function submitScore(score, timeSec) {
    const ident = getArcadeIdentity();
    if (!ident.id || !ident.name) return;
    try {
      await fetch(`${SUPABASE_URL}/functions/v1/arcade-submit-score`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ ikandyId: ident.id, ikandyName: ident.name, game: 'pong', score, timeSec: Math.round(timeSec * 1000) / 1000, interactionCount: interactions, sessionId })
      });
    } catch (_) {}
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 640, H = 420;
  const WIN = 7;
  const PW = 10, PH = 70, PSPEED = 5, BZ = 8;
  const PX_LEFT = 20, PX_RIGHT = W - 20 - PW;

  let playerY, aiY, ball, pScore, aScore, running, animId, keys = {};

  function getBest() { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10); }
  function setBest(v) { localStorage.setItem(BEST_KEY, String(Math.max(getBest(), v))); }

  function resetBall(toRight) {
    ball = { x: W / 2, y: H / 2, vx: (toRight ? 1 : -1) * 4.2, vy: (Math.random() < .5 ? 1 : -1) * 3 };
  }

  function startGame() {
    playerY = H / 2 - PH / 2; aiY = H / 2 - PH / 2;
    pScore = 0; aScore = 0; running = true; interactions = 0;
    startTime = performance.now();
    sessionId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
    resetBall(true);
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('over-overlay').classList.add('hidden');
    cancelAnimationFrame(animId); loop();
  }

  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','w','s'].includes(e.key)) { e.preventDefault(); interactions++; }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function update() {
    if (keys['ArrowUp']   || keys['w']) playerY -= PSPEED;
    if (keys['ArrowDown'] || keys['s']) playerY += PSPEED;
    playerY = Math.max(0, Math.min(H - PH, playerY));

    // AI — tracks ball at limited speed, only moves when ball crosses midpoint heading its way
    if (ball.vx > 0) {
      const aiCenter = aiY + PH / 2;
      const spd = 3.8 + aScore * 0.15;
      const diff = ball.y - aiCenter;
      if (Math.abs(diff) > 4) aiY += Math.sign(diff) * Math.min(spd, Math.abs(diff));
    }
    aiY = Math.max(0, Math.min(H - PH, aiY));

    ball.x += ball.vx; ball.y += ball.vy;

    if (ball.y < 0) { ball.y = 0; ball.vy *= -1; }
    if (ball.y + BZ > H) { ball.y = H - BZ; ball.vy *= -1; }

    // Left paddle hit
    if (ball.vx < 0 && ball.x <= PX_LEFT + PW && ball.x >= PX_LEFT && ball.y + BZ >= playerY && ball.y <= playerY + PH) {
      ball.x = PX_LEFT + PW;
      ball.vx = Math.abs(ball.vx) * 1.04;
      ball.vy += ((ball.y + BZ / 2) - (playerY + PH / 2)) * 0.12;
    }
    // Right paddle hit
    if (ball.vx > 0 && ball.x + BZ >= PX_RIGHT && ball.x + BZ <= PX_RIGHT + PW && ball.y + BZ >= aiY && ball.y <= aiY + PH) {
      ball.x = PX_RIGHT - BZ;
      ball.vx = -Math.abs(ball.vx) * 1.04;
      ball.vy += ((ball.y + BZ / 2) - (aiY + PH / 2)) * 0.12;
    }

    // Clamp speed
    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > 13) { ball.vx = ball.vx / spd * 13; ball.vy = ball.vy / spd * 13; }

    if (ball.x < 0)    { aScore++; if (aScore >= WIN) { endGame(false); return; } resetBall(true);  }
    if (ball.x > W)    { pScore++; if (pScore >= WIN) { endGame(true);  return; } resetBall(false); }
  }

  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    // Dashed center line
    ctx.setLineDash([10, 10]); ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.setLineDash([]);

    // Scores
    ctx.fillStyle = '#fff'; ctx.font = 'bold 52px Courier New';
    ctx.textAlign = 'right'; ctx.fillText(pScore, W / 2 - 24, 64);
    ctx.textAlign = 'left';  ctx.fillText(aScore, W / 2 + 24, 64);

    // Paddles & ball
    ctx.fillStyle = '#fff';
    ctx.fillRect(PX_LEFT,  playerY, PW, PH);
    ctx.fillRect(PX_RIGHT, aiY,     PW, PH);
    ctx.fillRect(ball.x, ball.y, BZ, BZ);
  }

  function loop() { if (!running) return; update(); draw(); animId = requestAnimationFrame(loop); }

  function endGame(won) {
    running = false; cancelAnimationFrame(animId);
    const timeSec = (performance.now() - startTime) / 1000;
    setBest(pScore);
    document.getElementById('over-title').textContent = won ? 'YOU WIN!' : 'GAME OVER';
    document.getElementById('final-score').textContent = `${pScore} \u2014 ${aScore}`;
    document.getElementById('over-overlay').classList.remove('hidden');
    submitScore(pScore, timeSec);
  }

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-retry').addEventListener('click', startGame);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
