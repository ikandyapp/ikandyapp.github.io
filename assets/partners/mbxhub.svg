<?xml version="1.0" encoding="UTF-8"?>
<svg class="huddle" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MBXHub" data-skin="hive"><style>.huddle{--speed: 1;}
.huddle .hd-ring {
  transform-box: view-box;
  transform-origin: 256px 256px;
}
.huddle .hd-slot {
  transform-box: view-box;
  transform-origin: 256px 256px;
  transform: rotate(calc(var(--i) * var(--step, 51.42857deg)));
}
.huddle .hd-dot {
  fill: var(--c);
  transform-box: fill-box;
  transform-origin: center;
}
.huddle .hd-core {
  fill: var(--core);
}
.huddle[data-skin="hive"] {
  --p0: #FFC93C;
  --p1: #F7B733;
  --p2: #FFD45E;
  --p3: #EFA92B;
  --p4: #FFCE4A;
  --p5: #F4B02E;
  --p6: #FFDA72;
  --core: #3FC9D6;          
  --ink:  #0E1B33;          
  --wing: rgba(214, 244, 255, .92);
  --orbit: rgba(255, 201, 60, .30);
  --ok:   #4FD69A;
  --warn: #FFC93C;
  --err:  #FF6B5A;
  --idle: #3FC9D6;
  --off:  #5C6B87;
  --dim: 0.18;
  --word-ink: rgba(14, 27, 51, .52);
  --word-lit: rgba(255, 255, 255, .40);
}
.huddle[data-skin="hive"] .hd-orbit {
  fill: none;
  stroke: var(--orbit);
  stroke-width: 3;
}
.huddle[data-skin="hive"] .hd-bee { fill: var(--c); }
.huddle[data-skin="hive"] .hd-body { fill: inherit; }
.huddle[data-skin="hive"] .hd-body,
.huddle[data-skin="hive"] .hd-head {
  stroke: var(--ink);
  stroke-width: 3;
}
.huddle[data-skin="hive"] .hd-head   { fill: var(--ink); stroke: none; opacity: .9; }
.huddle[data-skin="hive"] .hd-stripe { fill: var(--ink); }
.huddle[data-skin="hive"] .hd-wing {
  fill: var(--wing);
  stroke: rgba(14, 27, 51, .35);
  stroke-width: 2;
}
.huddle[data-skin="hive"] .hd-wing {
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
.huddle[data-skin="hive"] .hd-bee {
  transform-box: fill-box;
  transform-origin: center;
}
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+1) .hd-bee { --beat: 2.2s; }
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+2) .hd-bee { --beat: 3.3s; }
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+3) .hd-bee { --beat: 5.5s; }
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+4) .hd-bee { --beat: 3.3s; }
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+5) .hd-bee { --beat: 8.8s; }
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+6) .hd-bee { --beat: 2.2s; }
.huddle[data-skin="hive"] .hd-slot:nth-child(7n+7) .hd-bee { --beat: 5.5s; }
.huddle[data-skin="hive"]
.huddle[data-skin="hive"] .hd-core {
  fill: var(--core);
  stroke: rgba(14, 27, 51, .55);
  stroke-width: 5;
  stroke-linejoin: round;
}
.huddle[data-skin="hive"] .hd-facet {
  fill: none;
  stroke: rgba(255, 255, 255, .38);
  stroke-width: 4;
  stroke-linejoin: round;
}
.huddle[data-skin="hive"] .hd-word-ink { fill: var(--word-ink); }
.huddle[data-skin="hive"] .hd-word-lit { fill: var(--word-lit); }
.huddle[data-skin="hive"].noword .hd-word { display: none; }
.huddle[data-skin="hive"] .hd-glyph path { fill: var(--ink); opacity: .9; }
.huddle[data-skin="hive"]:not(.noword) .hd-glyph { display: none; }.huddle[data-skin="hive"][data-tint] .hd-bee { fill: var(--tint); }
.huddle[data-skin="hive"][data-tint] .hd-core { fill: var(--tint); }
.huddle[data-skin="hive"][data-tint="offline"] .hd-wing { fill: rgba(200, 214, 235, .32); }
.huddle[data-skin="hive"].simplify .hd-wing,
.huddle[data-skin="hive"].simplify .hd-stripe,
.huddle[data-skin="hive"].simplify .hd-head { display: none; }
.huddle[data-skin="hive"].simplify .hd-body {
  rx: 46px;
  ry: 46px;
  stroke-width: 4;
}
.huddle[data-skin="hive"].simplify .hd-facet { display: none; }
.huddle[data-skin="hive"].simplify .hd-orbit { stroke-width: 5; }</style><title>MBXHub</title><circle class="hd-orbit" cx="256" cy="256" r="156"></circle><g class="hd-ring"><g class="hd-slot" style="--i: 0; --step: 51.42857142857143deg;"><g class="hd-dot hd-bee" data-i="0" style="--i: 0; --c: var(--p0);"><g class="hd-wing-mount" transform="rotate(-40 223 86)"><ellipse class="hd-wing" cx="223" cy="86" rx="27" ry="13"></ellipse></g><g class="hd-wing-mount" transform="rotate(40 289 86)"><ellipse class="hd-wing" cx="289" cy="86" rx="27" ry="13"></ellipse></g><ellipse class="hd-body" cx="256" cy="104" rx="34" ry="31"></ellipse><circle class="hd-head" cx="256" cy="85" r="13"></circle><rect class="hd-stripe" x="225" y="92" width="62" height="9" rx="4.5"></rect><rect class="hd-stripe" x="229" y="112" width="54" height="9" rx="4.5"></rect></g></g><g class="hd-slot" style="--i: 1; --step: 51.42857142857143deg;"><g class="hd-dot hd-bee" data-i="1" style="--i: 1; --c: var(--p1);"><g class="hd-wing-mount" transform="rotate(-40 223 86)"><ellipse class="hd-wing" cx="223" cy="86" rx="27" ry="13"></ellipse></g><g class="hd-wing-mount" transform="rotate(40 289 86)"><ellipse class="hd-wing" cx="289" cy="86" rx="27" ry="13"></ellipse></g><ellipse class="hd-body" cx="256" cy="104" rx="34" ry="31"></ellipse><circle class="hd-head" cx="256" cy="85" r="13"></circle><rect class="hd-stripe" x="225" y="92" width="62" height="9" rx="4.5"></rect><rect class="hd-stripe" x="229" y="112" width="54" height="9" rx="4.5"></rect></g></g><g class="hd-slot" style="--i: 2; --step: 51.42857142857143deg;"><g class="hd-dot hd-bee" data-i="2" style="--i: 2; --c: var(--p2);"><g class="hd-wing-mount" transform="rotate(-40 223 86)"><ellipse class="hd-wing" cx="223" cy="86" rx="27" ry="13"></ellipse></g><g class="hd-wing-mount" transform="rotate(40 289 86)"><ellipse class="hd-wing" cx="289" cy="86" rx="27" ry="13"></ellipse></g><ellipse class="hd-body" cx="256" cy="104" rx="34" ry="31"></ellipse><circle class="h